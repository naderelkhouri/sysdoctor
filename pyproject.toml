[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sysdoctor"
version = "2.0.0"
authors = [
  { name = "Nader El Khouri", email = "naderelkhouri@gmail.com" }
]
description = "Diagnóstico, monitoramento e manutenção automatizada para distribuições Linux."
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Monitoring",
    "Topic :: System :: Systems Administration",
]
dependencies = [
    "psutil>=5.9.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "mypy>=1.0.0",
]

[project.urls]
"Homepage" = "https://github.com/naderelkhouri/sysdoctor"
"Bug Tracker" = "https://github.com/naderelkhouri/sysdoctor/issues"
"Source Code" = "https://github.com/naderelkhouri/sysdoctor"

[project.scripts]
sysdoctor = "sysdoctor.cli:main"

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
